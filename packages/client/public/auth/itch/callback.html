<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>itch.io Sign In</title>
  <style>
    body { margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0f1a0a; color:#d4c8a0; font-family:'Nunito',sans-serif; }
    .card { background:rgba(18,22,14,0.94); border:2px solid rgba(139,115,85,0.45); border-radius:16px; padding:40px; text-align:center; max-width:400px; }
    h2 { font-family:'Fredoka',sans-serif; color:#FFD93D; margin:0 0 12px; }
    p { color:#a89870; margin:8px 0; }
    .spinner { width:32px; height:32px; border:3px solid rgba(255,217,61,0.2); border-top-color:#FFD93D; border-radius:50%; animation:spin 0.8s linear infinite; margin:16px auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .error { color:#FF6B6B; }
    .success { color:#45E6B0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Signing in with itch.io...</h2>
    <div class="spinner" id="spinner"></div>
    <p id="status">Verifying your account...</p>
  </div>
  <script>
    (async function() {
      const status = document.getElementById('status');
      const spinner = document.getElementById('spinner');

      try {
        // Extract the authorization code from URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');

        if (!code) {
          // itch.io OAuth uses hash fragment for implicit flow
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          const accessToken = hashParams.get('access_token');

          if (accessToken) {
            // Implicit flow — send token directly
            if (window.opener) {
              window.opener.postMessage({ type: 'itch-auth-token', accessToken: accessToken }, '*');
              status.textContent = 'Success! Closing...';
              status.className = 'success';
              spinner.style.display = 'none';
              setTimeout(() => window.close(), 1000);
              return;
            }
          }

          throw new Error('No authorization code found');
        }

        // Exchange code via Cloud Function
        const apiBase = window.location.origin;
        const res = await fetch(apiBase + '/api/auth/itchCallback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: 'Unknown error' }));
          throw new Error(err.error || 'Auth failed');
        }

        const data = await res.json();

        // Send Firebase token back to the game window
        if (window.opener) {
          window.opener.postMessage({
            type: 'itch-auth',
            firebaseToken: data.firebaseToken,
            itchUser: data.itchUser,
          }, '*');

          status.textContent = 'Success! Closing...';
          status.className = 'success';
          spinner.style.display = 'none';
          setTimeout(() => window.close(), 1500);
        } else {
          status.textContent = 'Signed in! You can close this window.';
          status.className = 'success';
          spinner.style.display = 'none';
        }
      } catch (err) {
        spinner.style.display = 'none';
        status.textContent = err.message || 'Sign-in failed. Please try again.';
        status.className = 'error';

        // Notify opener of failure
        if (window.opener) {
          window.opener.postMessage({ type: 'itch-auth-error', error: err.message }, '*');
        }
      }
    })();
  </script>
</body>
</html>
